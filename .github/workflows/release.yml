# Surum yayini — ETIKETTEN, ELDEN DEGIL.
#
# Dizustunden `npm publish` calistirmak, tarball ile depo arasinda HICBIR bag
# kurmaz: indiren kisi paketin hangi kaynaktan derlendigini bilemez, yalnizca
# yukleyene guvenir. Bu SDK'nin butun tezi "her seyi kendin dogrulayabilirsin"
# oldugu icin, istemci kutuphanesinin nereden geldiginin dogrulanamaz olmasi
# teze aykiri olurdu.
#
# `--provenance` npm'e, paketin HANGI COMMIT'ten hangi workflow tarafindan
# uretildigini imzali olarak soyler ve npm sayfasinda dogrulanabilir bir rozet
# olarak gorunur.
#
# Yan faydasi kucuk degil: yayin jetonu yalnizca bir GitHub secret'i olarak
# yasar, kimsenin dizustunde ya da bir sunucunun ~/.npmrc'sinde durmaz.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Yayinlanacak etiket (or. v1.5.0)'
        required: true

permissions:
  contents: read
  # provenance imzasi icin gerekli
  id-token: write

jobs:
  publish:
    name: npm publish (provenance ile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      # ETIKET ILE PAKET SURUMU AYNI OLMAK ZORUNDA.
      #
      # Yoksa v1.6.0 etiketinden 1.5.0 yayinlanabilir ve npm'deki surum
      # deponun hangi noktasindan geldigini artik kimse soyleyemez —
      # provenance'in tam olarak cozdugu sorunu geri getirmis oluruz.
      - name: Etiket paketle uyusuyor mu
        run: |
          set -euo pipefail
          TAG="${{ inputs.tag || github.ref_name }}"
          PKG=$(node -p "require('./js/package.json').version")
          DAML=$(grep '^version:' daml.yaml | awk '{print $2}')
          echo "etiket=$TAG  js=$PKG  daml=$DAML"
          [ "$TAG" = "v$PKG" ] || { echo "etiket ile js surumu farkli"; exit 1; }
          # JS istemcisi ile Daml paketi tek bir anlasmayi kodluyor, o yuzden
          # MAJOR.MINOR esit olmali. PATCH ayrisabilir: yalnizca istemciyi
          # ilgilendiren bir duzeltme (paketleme, tipler, dokuman) yeni bir
          # Daml paketi ve yeni bir vetting turu gerektirmemeli — tam esitlik
          # istemek, kucuk bir JS duzeltmesini governance hizina baglardi.
          [ "${PKG%.*}" = "${DAML%.*}" ] || {
            echo "js ($PKG) ve daml ($DAML) major.minor ayrismis"; exit 1; }

      # KIMLIK VAR MI — HER SEYDEN ONCE.
      #
      # Yoksa `setup-node`'un yazdigi .npmrc `_authToken=` bos kalir ve npm
      # ENEEDAUTH ile duser — ama BUTUN testler kostuktan SONRA, ve hata
      # "makineyi yetkilendirin" diyerek asil sebebi (secret gelmiyor)
      # gizler. Ilk seferinde kaybedilen sey buydu.
      #
      # Sik karisan nokta: GitHub'da Variables ve Secrets AYRI depolardir.
      # `NPM_TOKEN` Variables sekmesine eklenirse `secrets.NPM_TOKEN` BOS
      # doner ve hicbir uyari cikmaz.
      - name: Yayin kimligi ayarli mi
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "${NPM_TOKEN}" ]; then
            echo "::error::NPM_TOKEN secret'i bos."
            echo "Settings > Secrets and variables > Actions > SECRETS sekmesi"
            echo "(Variables sekmesi degil — orada tutulan deger secrets.* ile okunmaz)"
            echo "Repository secret olmali; Environment secret bu workflow'dan gorunmez."
            exit 1
          fi
          echo "kimlik mevcut"

      # Yayinlanan sey test edilmemis olmasin.
      - name: Testler
        run: cd js && npm test

      - name: Python paritesi
        run: |
          python3 tools/digest_reference.py
          python3 tools/cycle_audit_reference.py

      - name: Publish
        run: cd js && npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # ─────────────────────────────────────────────────────────────────────────
  # PyPI
  #
  # Trusted publishing (OIDC), not an API token. There is no secret to leak,
  # rotate or paste into the wrong tab, and PyPI checks that the upload came
  # from this repository and this workflow. It has to be configured once on
  # PyPI's side; until it is, this job fails at the upload step and nothing
  # else.
  pypi:
    name: PyPI publish (trusted publishing)
    runs-on: ubuntu-latest
    permissions:
      # The OIDC token IS the credential.
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # BEFORE BUILDING ANYTHING. A tag that disagrees with the package, or a
      # client that has drifted from the Daml agreement, must not reach an index
      # that cannot delete what it accepts.
      - name: Etiket ve surum tutarli mi
        run: |
          set -euo pipefail
          TAG="${{ inputs.tag || github.ref_name }}"
          PY=$(grep -m1 '^version' python/pyproject.toml | cut -d'"' -f2)
          echo "etiket=$TAG  python=$PY"
          [ "$TAG" = "v$PY" ] || { echo "etiket ile python surumu farkli"; exit 1; }
          python3 tools/check_client_versions.py

      - name: Birim testleri
        run: python3 -m unittest discover -s python/tests

      - name: Build
        run: |
          python3 -m pip install --quiet build
          cd python && python3 -m build

      # The licence text is packaged from python/LICENSE, not the repository
      # root: this project is a subdirectory and setuptools cannot see above it.
      # A wheel that ships an SPDX string and no licence is a wheel that fails
      # somebody's compliance scan, months later.
      - name: Lisans metni pakette mi
        run: |
          set -euo pipefail
          cd python
          tar tzf dist/*.tar.gz | grep -q '/LICENSE$' || { echo "sdist LICENSE tasimiyor"; exit 1; }
          echo "LICENSE ve NOTICE pakette"

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/dist

  # ─────────────────────────────────────────────────────────────────────────
  # Maven Central
  #
  # Signing and the publishing plugin live in the pom's `release` profile, off
  # by default, so a laptop build never needs a key. `autoPublish` is false:
  # Central cannot delete a published version, so the deployment is staged and
  # released by a person who looked at it.
  maven:
    name: Maven Central publish (staged)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          server-id: central
          server-username: MAVEN_CENTRAL_USERNAME
          server-password: MAVEN_CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      - name: Etiket ve surum tutarli mi
        run: |
          set -euo pipefail
          TAG="${{ inputs.tag || github.ref_name }}"
          JAVA=$(grep -A1 '<artifactId>game-sdk</artifactId>' java/pom.xml \
                 | grep '<version>' | sed 's/.*<version>\(.*\)<.*/\1/')
          echo "etiket=$TAG  java=$JAVA"
          [ "$TAG" = "v$JAVA" ] || { echo "etiket ile java surumu farkli"; exit 1; }
          python3 tools/check_client_versions.py

      - name: Testler
        run: cd java && ./mvnw -B test

      - name: Deploy (staged, released by hand)
        run: cd java && ./mvnw -B -Prelease deploy -DskipTests
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
