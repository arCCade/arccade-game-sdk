# CI'in isi "testler geciyor mu" degil: BU DEPO KLONLANIP CALISIYOR MU.
#
# SDK'nin butun iddiasi baskalarinin onu kullanabilmesi. Yalnizca bizim
# makinemizde derlenen bir SDK, SDK degil; ve yeniden uretilemeyen bir DAR,
# agin vet ettigi seyle karsilastirilamaz — "vetted" o zaman bir kayit olur,
# dogrulanabilir bir olgu degil.
#
# Bu yuzden her is TEMIZ BIR CHECKOUT'tan, onceden kurulmus hicbir arCCade
# altyapisi olmadan calisir.
name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  daml:
    name: Daml — build, reproducibility, tests
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 — upgrade kontrolu onceki surumu KENDI etiketinden
      # yeniden derliyor, sig bir checkout'ta etiketler olmaz ve kontrol
      # sessizce atlanirdi. Sessizce atlanan bir kontrol, olmayan bir
      # kontrolden daha kotudur: yesil gorunur.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Java (Daml SDK icin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Surum daml.yaml'dan okunur: burada sabit bir surum yazmak, ikisinin
      # sessizce ayrismasina acik kapi birakirdi.
      - name: Daml SDK
        run: |
          set -euo pipefail
          SDK=$(grep '^sdk-version:' daml.yaml | awk '{print $2}')
          echo "Daml SDK $SDK"
          curl -sSL https://get.daml.com/ | sh -s "$SDK"
          echo "$HOME/.daml/bin" >> "$GITHUB_PATH"

      - name: Build
        run: daml build

      # M1'in "reproducible DAR build" maddesi tam olarak bu adim.
      - name: Paket kimligi yayinlananla ayni mi
        run: python3 tools/check_package_id.py

      - name: Daml testleri
        run: cd test-package && daml build && daml test

      # Bir onceki vetted surumden yukseltme HATA vermemeli. Uyari kabul
      # edilir (derleyicinin urettigi sabit adlari karsilastirmaktan gelir),
      # hata kabul edilmez: vet edilmis bir paketten alan ya da choice
      # kaldirmak agda geri alinamaz.
      - name: Upgrade uyumlulugu
        run: |
          set -euo pipefail
          VERSION=$(grep '^version:' daml.yaml | awk '{print $2}')
          PREV=$(python3 - <<'PY'
          import json, pathlib
          ids = json.loads(pathlib.Path('test-vectors/package-ids.json').read_text())['ids']
          vs = sorted(ids, key=lambda v: [int(x) for x in v.split('.')])
          cur = next(l.split(':',1)[1].strip() for l in pathlib.Path('daml.yaml').read_text().splitlines()
                     if l.startswith('version:'))
          i = vs.index(cur)
          print(vs[i-1] if i > 0 else '')
          PY
          )
          if [ -z "$PREV" ]; then echo "ilk surum, karsilastirilacak onceki yok"; exit 0; fi
          echo "onceki surum: $PREV"
          # Onceki surumu KENDI commit'inden yeniden derle: kaynagi degistirip
          # ayni etiketi tasiyan bir DAR'a karsi kontrol etmek anlamsiz olurdu.
          TAG=$(git tag -l "v$PREV" | head -1)
          if [ -z "$TAG" ]; then
            echo "v$PREV etiketi yok — upgrade kontrolu ATLANDI (etiketleyin)"
            exit 0
          fi
          git worktree add /tmp/prev "$TAG"
          (cd /tmp/prev && daml build)
          daml damlc upgrade-check "/tmp/prev/.daml/dist/arccade-game-sdk-$PREV.dar" \
                                   ".daml/dist/arccade-game-sdk-$VERSION.dar" 2>&1 | tee /tmp/upgrade.log
          if grep -q "Severity: DsError" /tmp/upgrade.log; then
            echo "UPGRADE HATASI — vet edilemez"; exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: dar
          path: .daml/dist/*.dar

  js:
    name: JavaScript — tests and parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Tests
        run: cd js && npm test
      # Paketin gercekten yayinlanabilir oldugunu ve README/LICENSE'in icinde
      # gittigini gorur. `npm publish` sirasinda fark etmek gec olur.
      - name: Paketleme
        run: cd js && npm pack --dry-run

  python:
    name: Python — cross-language parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Bu iki betik yalnizca "calisiyor mu" demez: Daml ve JavaScript'in
      # urettigi ALTIN DEGERLERE karsi kendini dogrular. Diller sessizce
      # ayrisirsa burasi kirilir.
      - name: Digest paritesi
        run: python3 tools/digest_reference.py
      - name: Agactan satir kurma paritesi
        run: python3 tools/cycle_audit_reference.py

      # The Python client shipped with no unit suite in CI: 56 tests covering
      # the refusals and the classes they carry, none of them reachable from a
      # build. `unittest discover`, not pytest, because the package declares no
      # dependencies and a test runner is a dependency.
      - name: Python birim testleri
        run: python3 -m unittest discover -s python/tests -v

  # --------------------------------------------------------------------------
  # Everything below gates the conformance suite. Before these jobs, the
  # milestone's central artifact could not fail a build: `grep -rn conformance
  # .github/` returned nothing, and neither did the Java module.
  # --------------------------------------------------------------------------

  java:
    name: Java — build and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 17, matching maven.compiler.release in java/pom.xml. Building on the
      # floor version is the only way this job proves the artifact a Java 17
      # consumer is promised actually compiles for them.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # mvnw downloads Maven on first use and resolves from Central. It is NOT
      # given -o here: the runner script uses -o against a local repository that
      # a clean checkout does not have, and an offline build in CI would fail
      # for a reason that has nothing to do with the code.
      - name: Testler
        run: cd java && ./mvnw -B test

      - name: Paketleme
        run: cd java && ./mvnw -B -DskipTests package

      - uses: actions/upload-artifact@v4
        with:
          name: game-sdk-jar
          path: java/target/*.jar

  conformance:
    name: Conformance — manifest, three runners, cross-runner parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # First, because it is the sharpest check in the repository and the
      # cheapest to run: it re-drives all 470 cases through the package entry
      # point and refuses to agree with the client about anything Daml pinned.
      # A drifted manifest makes every runner below compare against the wrong
      # contract, so a failure here should stop the job, not be one finding
      # among several.
      - name: Manifest is what the shipped client produces
        run: node conformance/generate.mjs --check

      # The three runners over one case set, and the .verdicts diff between
      # them. This is the milestone's headline claim; run-all.sh is where it
      # becomes a check that can fail. The suite ships RED on purpose, so the
      # gate is not "everything passed": it is "the per-case verdict triples
      # reproduce the frozen baseline in run-all.sh". A recorded divergence is
      # green; an unrecorded one, a moved one and a stale waiver are all red.
      # See the header of that file for why no waiver is inferred.
      - name: Three runners, one case set, one parity diff
        run: bash conformance/run-all.sh

      # Uploaded on failure too: the .jsonl records carry observed values and
      # raw error text per case, and a red parity diff is unreadable without
      # them.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: conformance-results
          path: conformance/runners/results/
