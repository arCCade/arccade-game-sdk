# CI'in isi "testler geciyor mu" degil: BU DEPO KLONLANIP CALISIYOR MU.
#
# SDK'nin butun iddiasi baskalarinin onu kullanabilmesi. Yalnizca bizim
# makinemizde derlenen bir SDK, SDK degil; ve yeniden uretilemeyen bir DAR,
# agin vet ettigi seyle karsilastirilamaz — "vetted" o zaman bir kayit olur,
# dogrulanabilir bir olgu degil.
#
# Bu yuzden her is TEMIZ BIR CHECKOUT'tan, onceden kurulmus hicbir arCCade
# altyapisi olmadan calisir.
name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  daml:
    name: Daml — build, reproducibility, tests
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 — upgrade kontrolu onceki surumu KENDI etiketinden
      # yeniden derliyor, sig bir checkout'ta etiketler olmaz ve kontrol
      # sessizce atlanirdi. Sessizce atlanan bir kontrol, olmayan bir
      # kontrolden daha kotudur: yesil gorunur.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Java (Daml SDK icin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Surum daml.yaml'dan okunur: burada sabit bir surum yazmak, ikisinin
      # sessizce ayrismasina acik kapi birakirdi.
      - name: Daml SDK
        run: |
          set -euo pipefail
          SDK=$(grep '^sdk-version:' daml.yaml | awk '{print $2}')
          echo "Daml SDK $SDK"
          curl -sSL https://get.daml.com/ | sh -s "$SDK"
          echo "$HOME/.daml/bin" >> "$GITHUB_PATH"

      - name: Build
        run: daml build

      # M1'in "reproducible DAR build" maddesi tam olarak bu adim.
      - name: Paket kimligi yayinlananla ayni mi
        run: python3 tools/check_package_id.py

      - name: Daml testleri
        run: cd test-package && daml build && daml test

      # Bir onceki vetted surumden yukseltme HATA vermemeli. Uyari kabul
      # edilir (derleyicinin urettigi sabit adlari karsilastirmaktan gelir),
      # hata kabul edilmez: vet edilmis bir paketten alan ya da choice
      # kaldirmak agda geri alinamaz.
      - name: Upgrade uyumlulugu
        run: |
          set -euo pipefail
          VERSION=$(grep '^version:' daml.yaml | awk '{print $2}')
          PREV=$(python3 - <<'PY'
          import json, pathlib
          ids = json.loads(pathlib.Path('test-vectors/package-ids.json').read_text())['ids']
          vs = sorted(ids, key=lambda v: [int(x) for x in v.split('.')])
          cur = next(l.split(':',1)[1].strip() for l in pathlib.Path('daml.yaml').read_text().splitlines()
                     if l.startswith('version:'))
          i = vs.index(cur)
          print(vs[i-1] if i > 0 else '')
          PY
          )
          if [ -z "$PREV" ]; then echo "ilk surum, karsilastirilacak onceki yok"; exit 0; fi
          echo "onceki surum: $PREV"
          # Onceki surumu KENDI commit'inden yeniden derle: kaynagi degistirip
          # ayni etiketi tasiyan bir DAR'a karsi kontrol etmek anlamsiz olurdu.
          TAG=$(git tag -l "v$PREV" | head -1)
          if [ -z "$TAG" ]; then
            echo "v$PREV etiketi yok — upgrade kontrolu ATLANDI (etiketleyin)"
            exit 0
          fi
          git worktree add /tmp/prev "$TAG"
          (cd /tmp/prev && daml build)
          daml damlc upgrade-check "/tmp/prev/.daml/dist/arccade-game-sdk-$PREV.dar" \
                                   ".daml/dist/arccade-game-sdk-$VERSION.dar" 2>&1 | tee /tmp/upgrade.log
          if grep -q "Severity: DsError" /tmp/upgrade.log; then
            echo "UPGRADE HATASI — vet edilemez"; exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: dar
          path: .daml/dist/*.dar

  js:
    name: JavaScript — tests and parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Tests
        run: cd js && npm test
      # Paketin gercekten yayinlanabilir oldugunu ve README/LICENSE'in icinde
      # gittigini gorur. `npm publish` sirasinda fark etmek gec olur.
      - name: Paketleme
        run: cd js && npm pack --dry-run

  python:
    name: Python — cross-language parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Bu iki betik yalnizca "calisiyor mu" demez: Daml ve JavaScript'in
      # urettigi ALTIN DEGERLERE karsi kendini dogrular. Diller sessizce
      # ayrisirsa burasi kirilir.
      - name: Digest paritesi
        run: python3 tools/digest_reference.py
      - name: Agactan satir kurma paritesi
        run: python3 tools/cycle_audit_reference.py
