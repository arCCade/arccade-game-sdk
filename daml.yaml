sdk-version: 3.4.10
name: arccade-game-sdk
version: 1.3.0
source: daml

# Kutuphane paketi: daml-script YOK. Testler ayri bir pakette
# (arccade-game-sdk-test) ve bu DAR'a data-dependency ile baglanir.
dependencies:
  - daml-prim
  - daml-stdlib

# Splice token standardi — yalnizca okuma tarafi (Holding view) ve metadata.
# Allocation, custody sinirini tiplemek icin duruyor; 1.0.0'da canli custody
# mekanigi TimeLockedHolding (LockedAmulet), Allocation degil.
data-dependencies:
  - /opt/arccade/canton/splice-node-0.7.1/dars/splice-api-token-metadata-v1-current.dar
  - /opt/arccade/canton/splice-node-0.7.1/dars/splice-api-token-holding-v1-current.dar
  - /opt/arccade/canton/splice-node-0.7.1/dars/splice-api-token-allocation-v1-current.dar
  - /opt/arccade/canton/splice-node-0.7.1/dars/splice-api-token-transfer-instruction-v1-current.dar
  - /opt/arccade/canton/splice-node-0.7.1/dars/splice-api-token-allocation-instruction-v1-current.dar

build-options:
  - --target=2.1
