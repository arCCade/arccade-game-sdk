sdk-version: 3.4.10
name: arccade-game-sdk
version: 1.6.0
source: daml

# Kutuphane paketi: daml-script YOK. Testler ayri bir pakette
# (test-package/, paket adi arccade-game-sdk-test) ve bu DAR'a data-dependency
# ile baglanir.
dependencies:
  - daml-prim
  - daml-stdlib

# Splice token standardi — yalnizca okuma tarafi (Holding view) ve metadata.
# Allocation, custody sinirini tiplemek icin duruyor; 1.0.0'da canli custody
# mekanigi TimeLockedHolding (LockedAmulet), Allocation degil.
data-dependencies:
  - vendor/splice-0.7.1/dars/splice-api-token-metadata-v1-current.dar
  - vendor/splice-0.7.1/dars/splice-api-token-holding-v1-current.dar
  - vendor/splice-0.7.1/dars/splice-api-token-allocation-v1-current.dar
  # AllocationV2: `committed` tasir. V1'de `Allocation_Withdraw`'in controller'i
  # tek basina gonderendir — o yuzden V1 allocation bir rezervasyondur, kilit
  # degil, ve Custody.daml onu bu gerekce ile reddeder. V2'de committed=True
  # olan bir allocation icin ayni choice ANCAK settlement deadline gectikten
  # sonra kullanilabilir (Splice dokumani, AllocationV2). Bu, custody olarak
  # kullanilabilir olmasinin tek sebebidir.
  #
  # V1 KALIYOR: 1.5.0'da yaratilmis kontratlarin tasidigi tip odur.
  - vendor/splice-0.7.1/dars/splice-api-token-allocation-v2-current.dar
  - vendor/splice-0.7.1/dars/splice-api-token-transfer-instruction-v1-current.dar
  - vendor/splice-0.7.1/dars/splice-api-token-allocation-instruction-v1-current.dar

build-options:
  - --target=2.1
