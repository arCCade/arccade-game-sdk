[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "arccade-game-sdk"
version = "1.6.0"
description = "Game-economy primitives for the Canton Network: canonical digests, Merkle audit proofs, cycle/trade/transfer command builders."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "arCCade" }]
keywords = ["canton", "daml", "splice", "audit", "merkle", "gaming"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Security :: Cryptography",
]
# STANDARD LIBRARY ONLY, deliberately. This client exists so a third party can
# verify arCCade's published documents without trusting arCCade; a verifier that
# drags dependencies into an auditor's environment is a verifier auditors will
# not run.
dependencies = []

[project.urls]
Homepage = "https://github.com/arccade/arccade-game-sdk"
Source = "https://github.com/arccade/arccade-game-sdk"

[tool.setuptools]
packages = ["arccade_game_sdk"]
# SHIPPED, not just declared. Without this the wheel carries the SPDX string and
# no licence text: the files sit at the repository root and this project is a
# subdirectory, so setuptools never sees them — the copies beside this file are
# what gets packaged. `js/` keeps its own copies for the same reason.
#
# Under [tool.setuptools], not [project]: `project.license-files` is PEP 639 and
# needs setuptools 77+, while build-system here declares >=68. Raising that floor
# to ship two text files would be the tail wagging the dog.
license-files = ["LICENSE", "NOTICE"]

[tool.setuptools.package-data]
arccade_game_sdk = ["py.typed"]
